<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <main class="card">
        <img src="../Icon.png" width="96" height="96" alt="YT Premium Vibe icon">
        <h1>YT Premium Vibe</h1>
        <p class="state-unknown">Turn on YT Premium Vibe in Safari’s Extensions settings.</p>
        <p class="state-on"><span class="pill on">● On</span> The extension is running in Safari. Open YouTube and enjoy.</p>
        <p class="state-off"><span class="pill off">● Off</span> The extension is installed but turned off in Safari.</p>
        <button class="open-preferences">Quit and Open Safari Extensions Preferences…</button>
        <p class="hint">Keep this app in Applications: the Download button uses it to run yt-dlp.</p>
    </main>
</body>
</html>
